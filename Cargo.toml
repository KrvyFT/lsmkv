[package]
name = "lsmkv"
version = "0.1.0"
edition = "2024"
description = "A high-performance, async-first Log-Structured Merge-Tree (LSM-Tree) Key-Value storage engine."
license = "MIT OR Apache-2.0"
repository = "https://github.com/KrvyFT/lsmkv"

[dependencies]
bincode = "1.3.3"
memmap2 = "0.9.11"
serde = { version = "1.0", features = ["derive"] }
thiserror = "2.0"
tokio = { version = "1", features = ["full"] }
zstd = "0.13.3"


[dev-dependencies]
tempfile = "3.27.0"
